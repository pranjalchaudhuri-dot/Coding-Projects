<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Utilities Science Lab</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            background-color: #6cf6626d;
            color: #18242d;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        h1 {
            color: #176b87;
            font-size: 2.5rem;
            font-weight: bold;
            font-family: 'Arial', sans-serif;
        }
    </style>
</head>

<body>

    <div class="jumbotron jumbotron-fluid text-center">
        <div class="container">
            <h1>My Science Lab</h1>
            <p class="lead">Welcome to the lab!</p>
            <nav class="mt-3">
                <ul class="nav justify-content-center">
                    <li class="nav-item">
                        <a class="nav-link text-success fw-bold" href="#experiments">Experiments Completed</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-success fw-bold" href="#progress">Research Progress</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-success fw-bold" href="#contact">Contact</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <div class="container my-4 text-center">
        <div class="d-flex flex-wrap gap-2 justify-content-center mb-4">
            <button class="btn btn-primary px-4">Chemistry</button>
            <button class="btn btn-secondary px-4">Physics</button>
            <button class="btn btn-success px-4">Biology</button>
            <button class="btn btn-danger px-4">Maths</button>
        </div>

        <div class="row g-4 text-start">
            <div id="experiments" class="col-md-6">
                <div class="p-4 bg-white rounded shadow-sm">
                    <h2 class="h4 border-bottom pb-2 mb-3">
                        Experiments Completed
                        <span class="badge bg-danger rounded-pill float-end">4</span>
                    </h2>
                    <p class="d-flex justify-content-between align-items-center mb-2">
                        Chemistry <span class="badge bg-primary">5</span>
                    </p>
                    <p class="d-flex justify-content-between align-items-center mb-2">
                        Physics <span class="badge bg-success">3</span>
                    </p>
                    <p class="d-flex justify-content-between align-items-center mb-2">
                        Biology <span class="badge bg-info text-dark">2</span>
                    </p>
                    <p class="d-flex justify-content-between align-items-center mb-0">
                        Maths <span class="badge bg-warning text-dark">1</span>
                    </p>
                </div>
            </div>


            <br>
            <hr>
            <br>
            <div id="progress" class="col-md-6">
                <div class="p-4 bg-white rounded shadow-sm">
                    <h2 class="h4 border-bottom pb-2 mb-3">Research Progress</h2>

                    <div class="mb-3">
                        <small class="fw-bold text-muted">Chemistry</small>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar bg-success" role="progressbar" style="width: 25%;"
                                aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">25%</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <small class="fw-bold text-muted">Physics</small>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar bg-info text-dark" role="progressbar" style="width: 50%;"
                                aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">50%</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <small class="fw-bold text-muted">Biology</small>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar bg-warning text-dark" role="progressbar" style="width: 75%;"
                                aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">75%</div>
                        </div>
                    </div>

                    <div class="mb-0">
                        <small class="fw-bold text-muted">Maths</small>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar bg-danger" role="progressbar" style="width: 100%;"
                                aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer id="contact" class="bg-dark text-white text-center py-3 mt-5">
        &copy; Made by Pranjal
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
