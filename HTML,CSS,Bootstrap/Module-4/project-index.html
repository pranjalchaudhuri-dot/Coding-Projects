<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Learning Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .jumbotron {
            background-color: #343a40;
            color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
        }

        .jumbotron h1 {
            font-size: 2.2rem;
            font-weight: bold;
        }

        .section-title {
            margin-top: 25px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #333333;
        }

        p {
            font-size: 1rem;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="jumbotron">
            <h1>Student Learning Dashboard</h1>
            <p>Track your subjects, completed lessons, and overall course progress.</p>
            <hr class="my-4 bg-light">
            <button type="button" class="btn btn-primary mr-2">Math</button>
            <button type="button" class="btn btn-success mr-2">Science</button>
            <button type="button" class="btn btn-warning mr-2">English</button>
            <button type="button" class="btn btn-danger">Coding</button>
        </div>

        <h3 class="section-title">
            Lessons Completed <span class="badge badge-dark">24</span>
        </h3>
        <div class="mb-4">
            <span class="badge badge-primary p-2 mr-2">Math: 8</span>
            <span class="badge badge-success p-2 mr-2">Science: 6</span>
            <span class="badge badge-warning p-2 mr-2">English: 4</span>
            <span class="badge badge-danger p-2">Coding: 6</span>
        </div>

        <h3 class="section-title">Subject Progress</h3>

        <p>Math</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width: 80%;">80%</div>
        </div>

        <p>Science</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width: 60%;">60%</div>
        </div>

        <p>English</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning text-dark" style="width: 40%;">40%</div>
        </div>

        <p>Coding</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width: 75%;">75%</div>
        </div>
    </div>

</body>

</html>
