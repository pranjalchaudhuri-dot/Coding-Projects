<!DOCTYPE html>

<head>

    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta http-equiv="refresh" content="5">


    <title>Animal fact file</title>

    <style type="text/css">
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: #377908;
            margin: 20px;
            border: 1cm solid rgb(1, 17, 47)e
        }

        .animal-fact {
            border: 2px rgb(1, 153, 1);
            padding: 15px;
            margin-bottom: 10px;
            background-color: #ebf9e1;
            display: inline-block;
            width: auto;
            box-shadow: 2px 2px 6px rgb(27, 51, 51);

        }


        .fact-file {

            display: flex;
            margin: 20px;
            color: darkslategray;
            width: 254px;
            height: auto;
            padding: 25px;

        }

        .animal-fact h2 {
            margin-top: 0;
            color: #2e8b3c
        }

        .animal-fact p {
            margin: 0
        }

        .animal-fact:hover {
            transform: translateX(1.2);
            transition: transform 0.3s ease;
        }

        .animal-name {
            font-style: italic;
            font-weight: bold;
            color: #619b0b
        }

        .cool-fact {
            font-style: italic;
            color: red;
            display: inline-block;
            background-color: antiquewhite;
            opacity: 0.4;
        }

        .animal-fact img {
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 10px;
        }

        .heading {
            position: sticky;
            display: block;
            transform:rotate(4deg);
            background-color:aqua;
            border:0.5cm dotted
            padding: 2cm

        }
    </style>





</head>

<body>
    <center>
        <h1 class="heading">My Animal Fact File</h1>
    </center>

    <center>
        <div class="fact-file">
            <div class="animal-fact">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg" alt="Cat">

                <h2>Cat</h2>

                <p class="cool-fact">Cats are small, carnivorous mammals that are often kept as pets. They are known for
                    their agility, playful
                    behavior, and ability to hunt vermin.</p>


            </div>



        </div>
    </center>
</body>
