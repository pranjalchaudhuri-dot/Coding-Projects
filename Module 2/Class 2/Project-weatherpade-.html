<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Page</title>
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #87ceeb;
            background-image: radial-gradient(circle, #ffffff 10%, transparent 11%);
            background-size: 20px 20px;
            background-position: top center;
            background-repeat: repeat;
            background-attachment: fixed;
        }
        h1 {
            color: #03032c;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #000000;
            font-size: 2.5rem;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h2 {
            color: #05054e;
            margin-top: 0;
            text-shadow: 1px 1px 2px #000000;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .weather-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
       
        .main-weatherbox {
            inline-size: 400px;
            block-size: 300px;
            padding: 20px;
            text-align: center;
            text-shadow: 1px 1px 2px #000000;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8d2VhdGhlcnxlbnwwfHwwfHx8&auto=format&fit=crop&w=800&q=60');
            color: #ffffff;
            box-sizing: border-box;
        }
        /* Requirement 6: Forecast section has a radial gradient */
        .forecast-box {
            background-image: radial-gradient(circle, #e0f7fa, #80deea);
            inline-size: 300px;
            block-size: 300px;
            padding: 15px;
            text-align: center;
            text-shadow: 1px 1px 3px #000000;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            color: #ffffff;
            box-sizing: border-box;
        }
        /* Requirement 7: Weather icon moves up and down using animation */
        .weather-icon {
            display: inline-block;
            font-size: 70px;
            width: 70px;
            height: 70px;
            margin: 10px 0;
            animation: floatCloud 3s infinite alternate;
        }
        @keyframes floatCloud {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(20px);
            }
        }
        .temp {
            font-size: 3rem;
            font-weight: bold;
            margin: 10px 0;
        }
        .desc {
            font-size: 1.2rem;
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <h1>Local Weather Report</h1>
    <div class="weather-container">
        <!-- Main Current Weather Box -->
        <div class="main-weatherbox">
            <h2>Current Weather</h2>
            <img class="weather-icon" src="https://img.icons8.com/?size=512w&id=658&format=png" alt="cloudy">
            <div class="temp">28°C</div>
            <div class="desc">Sunny & Clear</div>
        </div>
        <div class="forecast-box">
            <h2>Tomorrow's Forecast</h2>
            <img class="weather-icon" src="https://img.icons8.com/?size=100&id=648&format=png" alt="Sunny">
            <div class="temp">24°C</div>
            <div class="desc">Sunny</div>
        </div>
    </div>
</body>
</html>
