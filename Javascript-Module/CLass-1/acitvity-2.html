<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js variables basic sum practice</title>

    </head>


    <body>

       <h1>Js variables basic sum practice</h1>

       <p>We will be suming two numbers using js</p>


       <p id="result"></p>

       <script>
//delcaring the two numbers b4 sum
        let num1 = 345;
        let num2 = 567;

        let sum = num1 + num2;
        document.getElementById("result").innerHTML = "The sum of " + num1 + " and " + num2 + " is: " + sum + ".";
        document.getElementById("result").style.color = "green";
       </script>
