<body>
    <p id="demo"></p>
    <script>
        let day;
        let d = 3;

        switch (d) {
            case 0:
                day = "Sunday"
                break
            case 1:
                day = "Monday"
                break
            case 2:
                day = "Tuesday"
                break

            case 3:
                day = "wednseday"
                break
            case 4:
                day = "thurday"
                break

            case 5:
                day = "friday"
                break

                 case 6:
                day = "saturday"
                break

                default:
                    day = "unknown"
        };


        document.getElementById("demo").innerHTML="today is ..." + day;

    </script>
</body>
