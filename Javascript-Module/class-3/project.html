<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<script>

  for (let i = 1; i <= 10; i++) {
    document.write(i + "<br>");
  }

  let randomNumber = Math.floor(Math.random() * 100);
  document.write("Lucky random number: " + randomNumber + "<br>");


 
  let dayNumber = 4;
  let day;
   switch (dayNumber) {
            case 0:
                day = "Sunday"
                break
            case 1:
                day = "Monday"
                break
            case 2:
                day = "Tuesday"
                break

            case 3:
                day = "wednseday"
                break
            case 4:
                day = "thurday"
                break

            case 5:
                day = "friday"
                break

                 case 6:
                day = "saturday"
                break

                default:
                    day = "unknown"
        };




  document.write("Today's day number: " + day);

</script>

    
</body>
</html>
