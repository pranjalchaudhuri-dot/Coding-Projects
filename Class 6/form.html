<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Appointment Form</title>
</head>

<body>
<center>    <header>
        <h2>Doctors appointment Form</h2>
        <nav>

            <a href="#submit">View Submission Note</a>
        </nav>
    </header>

    <form action="#" method="POST">
        <fieldset>
            <legend>Patient Information</legend>
            <!-- Enhanced: Added 'for' and 'id' pairings for proper accessibility -->
            <label for="fullName">Full Name</label><br>
            <input type="text" id="fullName" name="fullName" required><br><br>

            <label for="dob">Date of Birth</label><br>
            <input type="date" id="dob" name="dob" required><br><br>

            <label for="phone">Phone Number</label><br>
            <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890" required>
        </fieldset>
        <br>
        <fieldset>
            <legend>Appointment Details</legend>
            <label for="doctor">Choose a Doctor</label><br>
            <select id="doctor" name="doctor" required>
                <option value="" disabled selected>Select a physician...</option>
                <option value="dr-smith">Dr. Jane Smith (General Medicine)</option>
                <option value="dr-jones">Dr. Alan Jones (Cardiology)</option>
                <option value="dr-taylor">Dr. Sarah Taylor (Pediatrics)</option>
                <option value="dr-lee">Dr. Michael Lee (Dermatology)</option>
            </select><br><br>

            <label for="reason">Reason for Visit</label><br>
            <select id="reason" name="reason" required>
                <option value="" disabled selected>Select a reason...</option>
                <option value="routine-checkup">Routine Checkup</option>
                <option value="illness">New Illness / Symptoms</option>
                <option value="follow-up">Follow-up Visit</option>
                <option value="vaccination">Vaccination</option>
            </select><br><br>

            <fieldset>
                <legend>Preferred Visit Day</legend>
                <label><input type="radio" name="preferredDay" value="monday" required> Monday</label><br>
                <label><input type="radio" name="preferredDay" value="tuesday"> Tuesday</label><br>
                <label><input type="radio" name="preferredDay" value="wednesday"> Wednesday</label><br>
                <label><input type="radio" name="preferredDay" value="thursday"> Thursday</label><br>
                <label><input type="radio" name="preferredDay" value="friday"> Friday</label>
            </fieldset>
        </fieldset>
        <br>
        <fieldset>
            <legend>Additional Information</legend>
            <label for="notes">Notes / Symptoms Description</label><br>
            <textarea id="notes" name="notes" rows="4" cols="40"
                placeholder="Please describe any symptoms..."></textarea>
        </fieldset>
        <br>
        <button type="submit">Book My Appointment</button>
    </form>

    </center>



    <section id="submit">
        <p>Find the submit button above</p>
    </section>
</body>

</html>
